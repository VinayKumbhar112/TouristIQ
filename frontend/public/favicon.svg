<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="shieldBg" x1="8" y1="6" x2="56" y2="58" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3B82F6" />
      <stop offset="0.5" stop-color="#1D4ED8" />
      <stop offset="1" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="coreGlow" x1="24" y1="20" x2="40" y2="38" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8" />
      <stop offset="1" stop-color="#2563EB" />
    </linearGradient>
    <filter id="glow" x="14" y="10" width="36" height="36" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Tactical Rounded Base -->
  <rect width="64" height="64" rx="16" fill="#0B1528" />
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="#1E3A8A" stroke-width="1.5" />

  <!-- Outer Radar Pulse Arc -->
  <circle cx="32" cy="29" r="19" stroke="#38BDF8" stroke-width="1" stroke-dasharray="3 3" opacity="0.4" />
  <circle cx="32" cy="29" r="23" stroke="#60A5FA" stroke-width="0.75" stroke-dasharray="2 4" opacity="0.25" />

  <!-- Tactical Primary Shield -->
  <path
    d="M32 9L49 16.5V30.5C49 42 41.5 50.5 32 54C22.5 50.5 15 42 15 30.5V16.5L32 9Z"
    fill="url(#shieldBg)"
    stroke="#60A5FA"
    stroke-width="2"
    stroke-linejoin="round"
  />

  <!-- Inner Crest Line -->
  <path
    d="M32 13L45 19V30C45 39.5 38.5 46.5 32 49.5C25.5 46.5 19 39.5 19 30V19L32 13Z"
    stroke="#93C5FD"
    stroke-width="1"
    stroke-opacity="0.5"
    fill="none"
  />

  <!-- GPS Location Pin with Integrated IQ Core -->
  <path
    d="M32 18C27.58 18 24 21.58 24 26C24 31.8 32 39.5 32 39.5C32 39.5 40 31.8 40 26C40 21.58 36.42 18 32 18Z"
    fill="url(#coreGlow)"
    stroke="#E0F2FE"
    stroke-width="1.2"
  />

  <!-- Intelligent "IQ" Center Pulse Node -->
  <circle cx="32" cy="25.5" r="4" fill="#FFFFFF" filter="url(#glow)" />
  <circle cx="32" cy="25.5" r="2" fill="#0284C7" />

  <!-- Dynamic Status Accent Spark -->
  <circle cx="45" cy="18" r="2.5" fill="#10B981" />
  <circle cx="45" cy="18" r="4.5" stroke="#10B981" stroke-width="0.75" opacity="0.6" />
</svg>